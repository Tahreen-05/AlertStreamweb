<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User & Provider Portals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 32px;
            padding: 48px 32px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 2rem;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .link-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            font-size: 1.25rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 60px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-user {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .btn-user:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }

        .btn-provider {
            background-color: #10b981;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
        }

        .btn-provider:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
            }

            .btn {
                font-size: 1rem;
                padding: 12px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✨ Choose your portal</h1>
        <div class="subtitle">Select the account type to continue</div>

        <div class="link-buttons">
            <!-- Replace the URLs with your actual user and provider links -->
            <a href="https://example.com/user" class="btn btn-user" target="_blank" rel="noopener noreferrer">
                👤 Go to User Page
            </a>
            <a href="https://example.com/provider" class="btn btn-provider" target="_blank" rel="noopener noreferrer">
                🏢 Go to Provider Page
            </a>
        </div>

        <div class="footer">
            Clicking will open the link in a new tab
        </div>
    </div>
</body>

</html>
